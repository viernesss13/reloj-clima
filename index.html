<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reloj y Clima</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            transition: background 0.5s ease;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 500px;
        }

        #time {
            font-size: 6rem;
            font-weight: bold;
            margin-bottom: 1rem;
            letter-spacing: -2px;
        }

        #date {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        #weather {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        #temp {
            font-size: 4rem;
            font-weight: bold;
        }

        #weather-desc {
            font-size: 1.5rem;
            text-transform: capitalize;
        }

        #weather-details {
            display: flex;
            gap: 2rem;
            font-size: 1.2rem;
            margin-top: 1rem;
        }

        .detail {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .detail-label {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .detail-value {
            font-weight: bold;
        }

        /* Background themes */
        .day-clear {
            background: linear-gradient(135deg, #87CEEB, #FFFFFF);
        }

        .day-cloudy {
            background: linear-gradient(135deg, #B0C4DE, #E6E6FA);
        }

        .day-rainy {
            background: linear-gradient(135deg, #708090, #D3D3D3);
        }

        .night-clear {
            background: linear-gradient(135deg, #2F4F4F, #000000);
        }

        .night-cloudy {
            background: linear-gradient(135deg, #4682B4, #2F4F4F);
        }

        .night-rainy {
            background: linear-gradient(135deg, #696969, #2F4F4F);
        }

        /* Loading state */
        .loading {
            font-size: 1.2rem;
            opacity: 0.7;
        }

        /* Error state */
        .error {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(255, 0, 0, 0.3);
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="time">--:--:--</div>
        <div id="date">--/--/----</div>

        <div id="weather" class="loading">
            <div id="temp">--°</div>
            <div id="weather-desc">Cargando...</div>
            <div id="weather-details">
                <div class="detail">
                    <div class="detail-label">Humedad</div>
                    <div class="detail-value" id="humidity">--%</div>
                </div>
                <div class="detail">
                    <div class="detail-label">Viento</div>
                    <div class="detail-value" id="wind">-- km/h</div>
                </div>
            </div>
        </div>

        <div id="error-message" class="error" style="display: none;">
            Error al cargar el clima. Verificando conexión...
        </div>
    </div>

    <script>
        // Update time every second
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('es-ES', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
            const dateString = now.toLocaleDateString('es-ES', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            document.getElementById('time').textContent = timeString;
            document.getElementById('date').textContent = dateString;

            // Update background based on time of day
            updateBackground();
        }

        // Fetch weather from Open-Meteo API
        async function fetchWeather() {
            try {
                // Using a default location (you can modify these coordinates)
                // These coordinates are for Madrid, Spain as an example
                const latitude = -34.7667;
                const longitude = -58.5333;

                const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true&timezone=auto`;

                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const data = await response.json();
                updateWeather(data.current_weather);
                hideError();
            } catch (error) {
                console.error('Error fetching weather:', error);
                showError();
            }
        }

        // Update weather display
        function updateWeather(weather) {
            const tempElement = document.getElementById('temp');
            const descElement = document.getElementById('weather-desc');
            const humidityElement = document.getElementById('humidity');
            const windElement = document.getElementById('wind');
            const weatherContainer = document.getElementById('weather');

            tempElement.textContent = Math.round(weather.temperature) + '°';
            descElement.textContent = getWeatherDescription(weather.weathercode);

            // For demo purposes, we'll simulate humidity and wind
            // In a real implementation, you'd get these from the API
            humidityElement.textContent = Math.random() * (80 - 30) + 30 | 0 + '%';
            windElement.textContent = Math.round(weather.windspeed) + ' km/h';

            weatherContainer.classList.remove('loading');

            // Update background based on weather
            updateBackground(weather.weathercode, new Date());
        }

        // Get weather description from WMO weather interpretation codes (WW)
        function getWeatherDescription(code) {
            const descriptions = {
                0: 'Despejado',
                1: 'Mayoritariamente despejado',
                2: 'Parcialmente nublado',
                3: 'Nublado',
                45: 'Niebla',
                48: 'Niebla con hielo',
                51: 'Llovizna leve',
                53: 'Llovizna moderada',
                55: 'Llovizna densa',
                56: 'Llovizna helada leve',
                57: 'Llovizna helada densa',
                61: 'Lluvia leve',
                63: 'Lluvia moderada',
                65: 'Lluvia fuerte',
                66: 'Lluvia helada leve',
                67: 'Lluvia helada fuerte',
                71: 'Nieve leve',
                73: 'Nieve moderada',
                75: 'Nieve fuerte',
                77: 'Granos de nieve',
                80: 'Chubascos leves',
                81: 'Chubascos moderados',
                82: 'Chubascos violentos',
                85: 'Chubascos de nieve leves',
                86: 'Chubascos de nieve fuertes',
                95: 'Tormenta',
                96: 'Tormenta con granizo leve',
                99: 'Tormenta con granizo fuerte'
            };

            return descriptions[code] || 'Desconocido';
        }

        // Update background based on time of day and weather
        function updateBackground(weatherCode = null, date = new Date()) {
            const hour = date.getHours();
            const isDay = hour >= 6 && hour < 20; // 6 AM to 8 PM is day

            // Determine weather type from code (simplified)
            let weatherType = 'clear'; // default
            if (weatherCode !== null) {
                if ([45, 48, 51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82].includes(weatherCode)) {
                    weatherType = 'rainy';
                } else if ([2, 3].includes(weatherCode)) {
                    weatherType = 'cloudy';
                }
            }

            // Set body class
            const body = document.body;
            body.className = '';

            if (isDay) {
                body.classList.add(`day-${weatherType}`);
            } else {
                body.classList.add(`night-${weatherType}`);
            }
        }

        // Show error message
        function showError() {
            document.getElementById('error-message').style.display = 'block';
            document.getElementById('weather').innerHTML = '<div class="error">Error al cargar el clima</div>';
        }

        // Hide error message
        function hideError() {
            document.getElementById('error-message').style.display = 'none';
        }

        // Initialize
        function init() {
            updateTime(); // Set initial time
            fetchWeather(); // Get initial weather

            // Update time every second
            setInterval(updateTime, 1000);

            // Update weather every 10 minutes
            setInterval(fetchWeather, 10 * 60 * 1000);
        }

        // Start when page loads
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
