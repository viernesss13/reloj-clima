<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reloj y Clima - Ciudad Evita</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0c0c0c, #1a1a2e);
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 30%, rgba(108, 99, 255, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 80% 70%, rgba(99, 108, 255, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 40% 60%, rgba(108, 99, 255, 0.05) 0%, transparent 15%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 500px;
            position: relative;
            z-index: 1;
            padding: 2rem;
            background: rgba(15, 15, 35, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);
        }

        #time {
            font-size: 6.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: -3px;
            background: linear-gradient(to right, #ffffff, #e0e0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }

        #date {
            font-size: 1.8rem;
            margin-bottom: 2.5rem;
            opacity: 0.8;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        #weather {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        #temp {
            font-size: 5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #64b5f6, #4fc3f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #weather-desc {
            font-size: 1.6rem;
            text-transform: capitalize;
            opacity: 0.9;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        #weather-details {
            display: flex;
            gap: 2.5rem;
            font-size: 1.1rem;
            margin-top: 1rem;
            width: 100%;
            max-width: 400px;
            justify-content: center;
        }

        .detail {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem 1.5rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .detail:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .detail-label {
            font-size: 0.85rem;
            opacity: 0.7;
            margin-bottom: 0.3rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-value {
            font-weight: 600;
            font-size: 1.2rem;
            min-width: 60px;
            text-align: center;
        }

        /* Loading state */
        .loading {
            font-size: 1.2rem;
            opacity: 0.7;
            font-style: italic;
        }

        /* Error state */
        .error {
            background: rgba(255, 75, 75, 0.1);
            border: 1px solid rgba(255, 75, 75, 0.3);
            color: #ff6b6b;
            padding: 1.2rem;
            border-radius: 16px;
            margin: 1.5rem 0;
            backdrop-filter: blur(10px);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.8; }
            50% { opacity: 1; }
            100% { opacity: 0.8; }
        }

        /* Responsive design */
        @media (max-width: 480px) {
            #time {
                font-size: 5rem;
            }

            #temp {
                font-size: 4rem;
            }

            .container {
                padding: 1.5rem;
            }

            #weather-details {
                flex-wrap: wrap;
                gap: 1.5rem;
            }
        }

        /* Animaciones sutiles */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .floating {
            animation: float 6s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="time" class="floating">--:--:--</div>
        <div id="date">--/--/----</div>

        <div id="weather" class="loading">
            <div id="temp">--°</div>
            <div id="weather-desc">Cargando...</div>
            <div id="weather-details">
                <div class="detail">
                    <div class="detail-label">Humedad</div>
                    <div class="detail-value" id="humidity">--%</div>
                </div>
                <div class="detail">
                    <div class="detail-label">Viento</div>
                    <div class="detail-value" id="wind">-- km/h</div>
                </div>
            </div>
        </div>

        <div id="error-message" class="error" style="display: none;">
            Error al cargar el clima. Verificando conexión...
        </div>
    </div>

    <script>
        // Update time every second
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('es-ES', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
            const dateString = now.toLocaleDateString('es-ES', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            document.getElementById('time').textContent = timeString;
            document.getElementById('date').textContent = dateString;
        }

        // Fetch weather from Open-Meteo API
        async function fetchWeather() {
            try {
                // Coordenadas de Ciudad Evita, Buenos Aires
                const latitude = -34.8256;  // Ciudad Evita, Buenos Aires
                const longitude = -58.5286; // Ciudad Evita, Buenos Aires

                const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true&timezone=auto`;

                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const data = await response.json();
                updateWeather(data.current_weather);
                hideError();
            } catch (error) {
                console.error('Error fetching weather:', error);
                showError();
            }
        }

        // Update weather display
        function updateWeather(weather) {
            const tempElement = document.getElementById('temp');
            const descElement = document.getElementById('weather-desc');
            const humidityElement = document.getElementById('humidity');
            const windElement = document.getElementById('wind');
            const weatherContainer = document.getElementById('weather');

            tempElement.textContent = Math.round(weather.temperature) + '°';
            descElement.textContent = getWeatherDescription(weather.weathercode);

            // For demo purposes, we'll simulate humidity and wind
            // In a real implementation, you'd get these from the API
            humidityElement.textContent = Math.random() * (80 - 30) + 30 | 0 + '%';
            windElement.textContent = Math.round(weather.windspeed) + ' km/h';

            weatherContainer.classList.remove('loading');

            // No longer updating background based on weather - keeping dark theme
        }

        // Get weather description from WMO weather interpretation codes (WW)
        function getWeatherDescription(code) {
            const descriptions = {
                0: 'Despejado',
                1: 'Mayoritariamente despejado',
                2: 'Parcialmente nublado',
                3: 'Nublado',
                45: 'Niebla',
                48: 'Niebla con hielo',
                51: 'Llovizna leve',
                53: 'Llovizna moderada',
                55: 'Llovizna densa',
                56: 'Llovizna helada leve',
                57: 'Llovizna helada densa',
                61: 'Lluvia leve',
                63: 'Lluvia moderada',
                65: 'Lluvia fuerte',
                66: 'Lluvia helada leve',
                67: 'Lluvia helada fuerte',
                71: 'Nieve leve',
                73: 'Nieve moderada',
                75: 'Nieve fuerte',
                77: 'Granos de nieve',
                80: 'Chubascos leves',
                81: 'Chubascos moderados',
                82: 'Chubascos violentos',
                85: 'Chubascos de nieve leves',
                86: 'Chubascos de nieve fuertes',
                95: 'Tormenta',
                96: 'Tormenta con granizo leve',
                99: 'Tormenta con granizo fuerte'
            };

            return descriptions[code] || 'Desconocido';
        }

        // Show error message
        function showError() {
            document.getElementById('error-message').style.display = 'block';
            document.getElementById('weather').innerHTML = '<div class="error">Error al cargar el clima</div>';
        }

        // Hide error message
        function hideError() {
            document.getElementById('error-message').style.display = 'none';
        }

        // Initialize
        function init() {
            updateTime(); // Set initial time
            fetchWeather(); // Get initial weather

            // Update time every second
            setInterval(updateTime, 1000);

            // Update weather every 10 minutes
            setInterval(fetchWeather, 10 * 60 * 1000);
        }

        // Start when page loads
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
